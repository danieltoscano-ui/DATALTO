-content:center;color:#4ADE80\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 11.08V12a10 10 0 1 1-5.93-9.14\"><\u002Fpath><path d=\"m9 11 3 3L22 4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <span style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#7C8088\">Entregados<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:32px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums\">{{ kEntg }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:20px\">\n          <div style=\"background:#2A3040;border:1px solid #4A4960;border-radius:12px;padding:20px\">\n            <h2 style=\"font-size:18px;font-weight:600;margin:0 0 2px\">Embudo de conversión<\u002Fh2>\n            <p style=\"font-size:13px;color:#7C8088;margin:0 0 18px\">De registro a entrega<\u002Fp>\n            <sc-for list=\"{{ stages }}\" as=\"stage\" hint-placeholder-count=\"4\">\n              <div style=\"margin-bottom:14px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px\">\n                  <span style=\"font-size:14px;font-weight:500;color:#F5F5F5\">{{ stage.label }}<\u002Fspan>\n                  <span style=\"font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:#F5F5F5\">{{ stage.n }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"height:12px;background:#252B37;border-radius:9999px;overflow:hidden\">\n                  <div style=\"height:100%;border-radius:9999px;width:{{ stage.width }};background:{{ stage.color }};transition:width 500ms cubic-bezier(0.16,1,0.3,1)\"><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"background:#2A3040;border:1px solid #4A4960;border-radius:12px;padding:20px\">\n            <h2 style=\"font-size:18px;font-weight:600;margin:0 0 2px\">Conversión por campaña<\u002Fh2>\n            <div style=\"display:flex;gap:16px;margin:6px 0 16px\">\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B0B8C4\"><span style=\"width:10px;height:10px;border-radius:3px;background:#FF5A00\"><\u002Fspan>DIDI<\u002Fspan>\n              <span style=\"display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#B0B8C4\"><span style=\"width:10px;height:10px;border-radius:3px;background:#3B82F6\"><\u002Fspan>Externa<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:16px;align-items:stretch;height:180px\">\n              <sc-for list=\"{{ barStages }}\" as=\"st\" hint-placeholder-count=\"3\">\n                <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0\">\n                  <div style=\"flex:1;display:flex;align-items:flex-end;justify-content:center;gap:8px;width:100%\">\n                    <div style=\"width:24px;background:#FF5A00;border-radius:6px 6px 0 0;height:{{ st.didiH }};min-height:3px;transition:height 500ms cubic-bezier(0.16,1,0.3,1)\"><\u002Fdiv>\n                    <div style=\"width:24px;background:#3B82F6;border-radius:6px 6px 0 0;height:{{ st.extH }};min-height:3px;transition:height 500ms cubic-bezier(0.16,1,0.3,1)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <span style=\"font-size:12px;color:#B0B8C4;font-weight:500\">{{ st.label }}<\u002Fspan>\n                  <span style=\"font-size:11px;color:#7C8088;font-variant-numeric:tabular-nums\">{{ st.summary }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid;grid-template-columns:{{ c adius:12px;padding:20px\">\n            <h2 style=\"font-size:18px;font-weight:600;margin:0 0 4px\">Próximos eventos<\u002Fh2>\n            <p style=\"font-size:13px;color:#7C8088;margin:0 0 8px\">Entrevistas y entregas por venir<\u002Fp>\n            <sc-if value=\"{{ hasUpcoming }}\" hint-placeholder-val=\"{{ true }}\">\n              <div>\n                <sc-for list=\"{{ upcoming }}\" as=\"ev\" hint-placeholder-count=\"0\">\n                  <div style=\"display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(74,73,96,0.4)\">\n                    <div style=\"width:8px;height:8px;border-radius:9999px;flex-shrink:0;background:{{ ev.color }}\"><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-weight:600;font-size:13px;color:#F5F5F5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ ev.nombre }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#7C8088\">{{ ev.typeLabel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12px;color:#B0B8C4;white-space:nowrap;font-variant-numeric:tabular-nums\">{{ ev.dateLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ noUpcoming }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"font-size:13px;color:#535862;margin:24px 0;text-align:center\">Sin eventos programados. Captura fechas de entrevista o entrega.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ CANDIDATOS ============ -->\n      <sc-if value=\"{{ isCandidatos }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"animation:fadeIn 300ms ease-out\">\n\n        <div style=\"background:#2A3040;border:1px solid #4A4960;border-radius:12px;padding:20px;margin-bottom:20px\">\n   <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <label style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#7C8088\">Cuenta CLABE<\u002Flabel>\n              <input value=\"{{ form.clabe }}\" onchange=\"{{ setClabe }}\" placeholder=\"18 dígitos\" style=\"width:100%;box-sizing:border-box;background:#252B37;border:1px solid #4A4960;border-radius:10px;padding:10px 12px;color:#F5F5F5;font-size:14px;outline:none;font-family:'JetBrains Mono',monospace\" style-focus=\"border-color:#FF5A00\">\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <label style=\"font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:#7C8088\">Vehículo<\u002Flabel>\n              <input value=\"{{ form.vehiculo }}\" onchange=\"{{ setVehiculo }}\" placeholder=\"Modelo / placa\" style=\"width:100%;box-sizing:border-box;background:#252B37;border:1px solid #4A4960;border-radius:10px;padding:10px 12px;color:#F5F5F5;font-size:14px;outline:none;font-family:inherit\" style-focus=\"border-color:#FF5A00\">\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <button onclick=\"{{ addCandidato }}\" style=\"{{ addBtnStyle }}\">Agregar candidato<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:12px;color:#535862;margin:14px 0 0\">La fecha de registro se guarda automáticamente. Después solo marca las casillas de estatus.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px\">\n          <h2 style=\"font-size:18px;font-weight:600;margin:0\">Base de candidatos <span style=\"color:#7C8088;font-weight:500\">· {{ kTotal }}<\u002Fspan><\u002Fh2>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ hasCand }}\" hint-placeholder-val=\"{{ false }}\">\n        < &quot;showClabe&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Comportamiento&quot;}}\">\nclass Component extends DCLogic {\n  DOCS = [['ine','INE'],['licencia','Licencia'],['ganancias','Ganancias'],['perfil','Perfil'],['ubicacion','Ubicación'],['comprobante','Comprobante'],['constancia','Constancia']];\n  MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];\n  MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];\n  KEY = 'lafa_cleo_candidatos_v1';\n\n  // ============================================================\n  //  SUPABASE — pega aquí la URL y la anon key de tu proyecto.\n  //  Vacío   = modo local (solo este navegador).\n  //  Con datos = sincroniza en la nube y entre dispositivos solo.\n  // ============================================================\n  CONFIG = {\n    url: 'https://svvdpprcpjvkdaqausqc.supabase.co',\n    anonKey: 'sb_publishable_Jt-4TPq0BWbBfh_Bs_biHg_uiPvbxxp',\n  };\n  remote = null;\n  channel = null;\n\n  state = {\n    tab: 'inicio',\n    candidatos: [],\n    form: { nombre:'', campana:'DIDI', numero:'', clabe:'', vehiculo:'' },\n    calY: new Date().getFullYear(),\n    calM: new Date().getMonth(),\n    isMobile: false,\n    syncMode: 'local',\n    syncError: '',\n  };\n\n  componentDidMount() {\n    try { const s = localStorage.getItem(this.KEY); if (s) this.setState({ candidatos: JSON.parse(s) }); } catch (e) {}\n    const dc = (this.props.defaultCampana === 'Externa') ? 'Externa' : 'DIDI';\n    const patch = { form: { nombre:'', campana:dc, numero:'', clabe:'', vehiculo:'' } };\n    if (this.props.startTab) patch.tab = this.props.startTab;\n    this.setState(patch);\n    this.onResize = () => this.setState({ isMobile: window.innerWidth < 880 });\n    this.onResize();\n    window.addEventListener('resize', this.onResize);\n    this.initRemote();\n  }\n  componentWillUnmount() {\n    if (this.onResize) window.removeEventListener('resize', this.onResize);\n    if (this.channel && this.remote) this.remote.removeChannel(this.channel);\n  }\n\n  iso(d) { const p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`; }\n  fmt(s) { if (!s) return '—'; const a = s.split('-').map(Number); return `${a[2]} ${this.MESES[a[1]-1]} ${a[0]}`; }\n  save(list) { try { localStorage.setItem(this.KEY, JSON.stringify(list)); } catch (e) {} }\n\n  // ---- Supabase sync ----\n  DOCS_DEFAULT() { const d = {}; this.DOCS.forEach(([k]) => d[k] = false); return d; }\n  toRow(c) { return { id:c.id, nombre:c.nombre, campana:c.campana, numero:c.numero, clabe:c.clabe, vehiculo:c.vehiculo, fecha_registro:c.fechaRegistro||null, entrevista:!!c.entrevista, apartado:!!c.apartado, entregado:!!c.entregado, fecha_entrevista:c.fechaEntrevista||null, docs:c.docs||{}, fecha_apartado:c.fechaApartado||null, promesa_entrega:c.promesaEntrega||null, fecha_entrega:c.fechaEntrega||null }; }\n  fromRow(r) { return { id:r.id, nombre:r.nombre||'', campana:r.campana||'DIDI', numero:r.numero||'', clabe:r.clabe||'', vehiculo:r.vehiculo||'', fechaRegistro:r.fecha_registro||'', entrevista:!!r.entrevista, apartado:!!r.apartado, entregado:!!r.entregado, fechaEntrevista:r.fecha_entrevista||'', docs: Object.assign(this.DOCS_DEFAULT(), r.docs||{}), fechaApartado:r.fecha_apartado||'', promesaEntrega:r.promesa_entrega||'', fechaEntrega:r.fecha_entrega||'' }; }\n\n  initRemote(tries) {\n    tries = tries || 0;\n    if (!this.CONFIG.url || !this.CONFIG.anonKey) return;\n    if (!window.supabase || !window.supabase.createClient) { if (tries < 40) setTimeout(() => this.initRemote(tries + 1), 150); return; }\n    try {\n      this.remote = window.supabase.createClient(this.CONFIG.url, this.CONFIG.anonKey);\n      this.setState({ syncMode: 'cloud' });\n      this.fetchRemote();\n      this.channel = this.remote.channel('candidatos-rt')\n        .on('postgres_changes', { event: '*', schema: 'public', table: 'candidatos' }, (payload) => this.applyRemoteChange(payload))\n        .subscribe();\n    } catch (e) { this.setState({ syncError: 'No se pudo conectar' }); }\n  }\n  pending = {};\n  markPending(id) { this.pending[id] = Date.now() + 2500; }\n  isPending(id) { return this.pending[id] && this.pending[id] > Date.now(); }\n\n  // Aplica un solo cambio remoto (de otro dispositivo) sin recargar toda la lista,\n  // e ignora el eco de nuestras propias escrituras recientes para no pisar tus clics.\n  applyRemoteChange(payload) {\n    const type = payload.eventType || payload.event;\n    const n = payload.new, o = payload.old;\n    const id = (n && n.id) || (o && o.id);\n    if (!id || this.isPending(id)) return;\n    this.setState(s => {\n      let list = s.candidatos.slice();\n      if (type === 'DELETE') list = list.filter(c => c.id !== id);\n      else if (n) {\n        const inc = this.fromRow(n);\n        const i = list.findIndex(c => c.id === id);\n        if (i >= 0) list[i] = inc; else list = [inc, ...list];\n      }\n      this.save(list);\n      return { candidatos: list };\n    });\n  }\n\n  fetchRemote() {\n    if (!this.remote) return;\n    this.remote.from('candidatos').select('*').order('created_at', { ascending: false }).then(({ data, error }) => {\n      if (error) { this.setState({ syncError: 'Error al leer' }); return; }\n      if (!data) { this.setState({ syncError: '' }); return; }\n      this.setState(s => {\n        const byId = {};\n        data.map(r => this.fromRow(r)).forEach(r => { byId[r.id] = r; });\n        // conserva filas con escritura local pendiente (aún no confirmada)\n        s.candidatos.forEach(c => { if (this.isPending(c.id)) byId[c.id] = c; });\n        const list = Object.values(byId).sort((a, b) => (a.fechaRegistro < b.fechaRegistro ? 1 : -1));\n        this.save(list);\n        return { candidatos: list, syncError: '' };\n      });\n    });\n  }\n  pushRemote(c) {\n    if (!this.remote) return;\n    this.markPending(c.id);\n    this.remote.from('candidatos').upsert(this.toRow(c)).then(({ error }) => this.setState({ syncError: error ? 'Error al sincronizar' : '' }));\n  }\n  deleteRemote(id) {\n    if (!this.remote) return;\n    this.markPending(id);\n    this.remote.from('candidatos').delete().eq('id', id).then(({ error }) => this.setState({ syncError: error ? 'Error al sincronizar' : '' }));\n  }\n\n  // ---- Mutations (optimista: estado local + push a la nube) ----\n  mutate = (id, fn) => this.setState(s => {\n    let changed = null;\n    const list = s.candidatos.map(c => { if (c.id === id) { changed = fn({ ...c, docs: { ...c.docs } }); return changed; } return c; });\n    this.save(list); if (changed) this.pushRemote(changed);\n    return { candidatos: list };\n  });\n\n  setForm = (k, v) => this.setState(s => ({ form: { ...s.form, [k]: v } }));\n  setNombre = e => this.setForm('nombre', e.target.value);\n  setNumero = e => this.setForm('numero', e.target.value);\n  setClabe = e => this.setForm('clabe', e.target.value);\n  setVehiculo = e => this.setForm('vehiculo', e.target.value);\n  setCampanaDIDI = () => this.setForm('campana', 'DIDI');\n  setCampanaExterna = () => this.setForm('campana', 'Externa');\n\n  addCandidato = () => {\n    const f = this.state.form;\n    if (!f.nombre.trim()) return;\n    const c = {\n      id: 'c' + Date.now() + Math.random().toString(36).slice(2,5),\n      nombre: f.nombre.trim(), campana: f.campana, numero: f.numero.trim(),\n      clabe: f.clabe.trim(), vehiculo: f.vehiculo.trim(), fechaRegistro: this.iso(new Date()),\n      entrevista: false, apartado: false, entregado: false, fechaEntrevista: '',\n      docs: { ine:false, licencia:false, ganancias:false, perfil:false, ubicacion:false, comprobante:false, constancia:false },\n      fechaApartado: '', promesaEntrega: '', fechaEntrega: '',\n    };\n    const dc = this.state.form.campana;\n    this.pushRemote(c);\n    this.setState(s => { const list = [c, ...s.candidatos]; this.save(list); return { candidatos: list, form: { nombre:'', campana:dc, numero:'', clabe:'', vehiculo:'' } }; });\n  };\n\n  del = id => { this.deleteRemote(id); this.setState(s => { const list = s.candidatos.filter(c => c.id !== id); this.save(list); return { candidatos: list }; }); };\n\n  setEnt = (id, v) => this.mutate(id, c => { c.entrevista = v; if (!v) { c.apartado = false; c.entregado = false; } return c; });\n  setApa = (id, v) => this.mutate(id, c => { c.apartado = v; if (v) c.entrevista = true; if (!v) c.entregado = false; return c; });\n  setEntg = (id, v) => this.mutate(id, c => { c.entregado = v; if (v) { c.entrevista = true; c.apartado = true; if (!c.fechaEntrega) c.fechaEntrega = this.iso(new Date()); } return c; });\n  toggleDoc = (id, k) => this.mutate(id, c => { c.docs[k] = !c.docs[k]; return c; });\n  setDate = (id, field, v) => this.mutate(id, c => { c[field] = v; if (field === 'fechaEntrega' && v) { c.entregado = true; c.apartado = true; c.entrevista = true; } return c; });\n\n  goInicio = () => this.setState({ tab:'inicio' });\n  goCandidatos = () => this.setState({ tab:'candidatos' });\n  goEntrevista = () => this.setState({ tab:'entrevista' });\n  goApartado = () => this.setState({ tab:'apartado' });\n  goEntregado = () => this.setState({ tab:'entregado' });\n  prevMonth = () => this.setState(s => { let m = s.calM - 1, y = s.calY; if (m < 0) { m = 11; y--; } return { calM:m, calY:y }; });\n  nextMonth = () => this.setState(s => { let m = s.calM + 1, y = s.calY; if (m > 11) { m = 0; y++; } return { calM:m, calY:y }; });\n\n  renderVals() {\n    const C = this.state.candidatos;\n    const M = this.state.isMobile;\n    const total = C.length;\n    const nEnt = C.filter(c => c.entrevista).length;\n    const nApa = C.filter(c => c.apartado).length;\n    const nEntg = C.filter(c => c.entregado).length;\n    const showClabe = this.props.showClabe !== false;\n\n    const w = n => total > 0 ? Math.round(n / total * 100) + '%' : '0%';\n    const stages = [\n      { label:'Registrados', n: total, color:'#7C8088', width: total ? '100%' : '0%' },\n      { label:'Entrevista', n: nEnt, color:'#3B82F6', width: w(nEnt) },\n      { label:'Apartado', n: nApa, color:'#8B5CF6', width: w(nApa) },\n      { label:'Entregado', n: nEntg, color:'#22C55E', width: w(nEntg) },\n    ];\n\n    const cnt = (camp, field) => C.filter(c => c.campana === camp && c[field]).length;\n    const stagesDef = [['Entrevista','entrevista'],['Apartado','apartado'],['Entregado','entregado']];\n    let maxB = 1;\n    stagesDef.forEach(([, f]) => { maxB = Math.max(maxB, cnt('DIDI', f), cnt('Externa', f)); });\n    const barStages = stagesDef.map(([label, f]) => {\n      const d = cnt('DIDI', f), e = cnt('Externa', f);\n      return { label, didiH: Math.round(d / maxB * 100) + '%', extH: Math.round(e / maxB * 100) + '%', summary: `DIDI ${d} · Ext ${e}` };\n    });\n\n    const { calY, calM } = this.state;\n    const startDow = new Date(calY, calM, 1).getDay();\n    const dim = new Date(calY, calM + 1, 0).getDate();\n    const evMap = {};\n    C.forEach(c => {\n      if (c.fechaEntrevista) (evMap[c.fechaEntrevista] = evMap[c.fechaEntrevista] || {}).ent = true;\n      if (c.fechaEntrega) (evMap[c.fechaEntrega] = evMap[c.fechaEntrega] || {}).entrega = true;\n      else if (c.promesaEntrega) (evMap[c.promesaEntrega] = evMap[c.promesaEntrega] || {}).promesa = true;\n    });\n    const todayIso = this.iso(new Date());\n    const p = n => String(n).padStart(2,'0');\n    const calCells = [];\n    for (let i = 0; i < startDow; i++) calCells.push({ day:'', style:'min-height:58px;border:1px solid transparent;background:transparent', dots: [] });\n    for (let d = 1; d <= dim; d++) {\n      const key = `${calY}-${p(calM+1)}-${p(d)}`;\n      const ev = evMap[key] || {};\n      const dots = [];\n      if (ev.ent) dots.push({ style:'width:6px;height:6px;border-radius:9999px;background:#3B82F6' });\n      if (ev.ent
